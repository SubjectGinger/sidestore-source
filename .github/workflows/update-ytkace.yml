
name: Update YTKACE SideStore Source

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-ytkace
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download, mirror and update SideStore source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          cat > update.py <<'PY'
          import json
          import os
          import re
          import urllib.request
          import urllib.error
          import zipfile
          import plistlib
          import subprocess

          token = os.environ["GH_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          api = "https://api.github.com"

          def request(url, method="GET", data=None,
                      content_type="application/vnd.github+json"):
              headers = {
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28"
              }

              if data is not None:
                  headers["Content-Type"] = content_type

              req = urllib.request.Request(
                  url, data=data, headers=headers, method=method
              )

              with urllib.request.urlopen(req) as response:
                  body = response.read()
                  return json.loads(body) if body else None

          # 1. Find the latest upstream YTKACE release.
          upstream = request(
              f"{api}/repos/itzzace/ytkace/releases/latest"
          )

          upstream_tag = upstream["tag_name"]
          release_notes = (upstream.get("body") or "").strip()

          if not release_notes:
              release_notes = "No release notes provided by the developer."

          print("Latest upstream release:", upstream_tag)

          # 2. Check our existing mirrored release.
          release = None

          try:
              release = request(
                  f"{api}/repos/{repo}/releases/tags/ytkace-latest"
              )

              if f"Upstream tag: {upstream_tag}" in release.get("body", ""):
                  print("Already up to date. Skipping.")
                  raise SystemExit(0)

          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise

          # 3. Find the standard YouTube IPA.
          matches = [
              asset for asset in upstream["assets"]
              if re.fullmatch(
                  r"YTKACE_.+_YouTube_.+\.ipa",
                  asset["name"]
              )
              and "iOS16" not in asset["name"]
          ]

          if len(matches) != 1:
              raise Exception(
                  f"Expected one standard YouTube IPA, found {len(matches)}"
              )

          asset = matches[0]

          print("Selected IPA:", asset["name"])

          # 4. Download the IPA.
          req = urllib.request.Request(
              asset["browser_download_url"],
              headers={"User-Agent": "YTKACE-SideStore-Updater"}
          )

          with urllib.request.urlopen(req) as response:
              ipa_data = response.read()

          with open("YTKACE.ipa", "wb") as file:
              file.write(ipa_data)

          # 5. Extract actual app metadata.
          with zipfile.ZipFile("YTKACE.ipa") as ipa:
              plist_paths = [
                  name for name in ipa.namelist()
                  if re.fullmatch(
                      r"Payload/[^/]+\.app/Info\.plist",
                      name
                  )
              ]

              if not plist_paths:
                  raise Exception("Could not find app Info.plist")

              info = plistlib.loads(ipa.read(plist_paths[0]))

          bundle_id = info["CFBundleIdentifier"]
          version = info["CFBundleShortVersionString"]
          app_name = info.get(
              "CFBundleDisplayName",
              info.get("CFBundleName", "YTKACE")
          )

          print("App:", app_name)
          print("Bundle ID:", bundle_id)
          print("Version:", version)
          print("IPA size:", len(ipa_data))

          # 6. Create or update our permanent GitHub release.
          release_body = (
              f"Automatically mirrored from itzzace/ytkace.\n\n"
              f"Upstream tag: {upstream_tag}\n"
              f"Original file: {asset['name']}\n\n"
              f"---\n\n"
              f"## Official Release Notes\n\n"
              f"{release_notes}"
          )

          if release:
              print("Updating existing mirrored release.")

              # Remove only the previous IPA attachment.
              for old_asset in release.get("assets", []):
                  if old_asset["name"] == "YTKACE.ipa":
                      request(
                          f"{api}/repos/{repo}/releases/assets/"
                          f"{old_asset['id']}",
                          method="DELETE"
                      )

              # Update the release without deleting its tag.
              release = request(
                  f"{api}/repos/{repo}/releases/{release['id']}",
                  method="PATCH",
                  data=json.dumps({
                      "name": f"YTKACE {version}",
                      "body": release_body,
                      "make_latest": "true"
                  }).encode()
              )

          else:
              print("Creating first mirrored release.")

              release = request(
                  f"{api}/repos/{repo}/releases",
                  method="POST",
                  data=json.dumps({
                      "tag_name": "ytkace-latest",
                      "name": f"YTKACE {version}",
                      "body": release_body,
                      "make_latest": "true"
                  }).encode()
              )

          # 7. Upload the new IPA.
          upload_url = release["upload_url"].split("{")[0]

          request(
              upload_url + "?name=YTKACE.ipa",
              method="POST",
              data=ipa_data,
              content_type="application/octet-stream"
          )

          print("IPA successfully uploaded.")

          # 8. Generate the SideStore apps.json.
          source = {
              "$schema": "https://github.com/SideStore/sidestore-source-types/raw/main/schema.json",
              "name": "Personal Source",
              "subtitle": "YTKACE for Sidestore and LiveContainer",
              "description": "My personal Sidestore source for YTKACE.",
              "website": "https://itzzace.github.io/ytkace/",
              "identifier": "com.subjectginger.sidestore",
              "apps": [
                  {
                      "name": "YTKACE",
                      "bundleIdentifier": bundle_id,
                      "developerName": "itzzace",
                      "subtitle": "YouTube with YTKACE modifications",
                      "localizedDescription": "Automatically updated YTKACE YouTube IPA.",
                      "iconURL": (
                          f"https://raw.githubusercontent.com/"
                          f"{repo}/main/icon.png"
                      ),
                      "versions": [
                          {
                              "version": version,
                              "date": upstream["published_at"][:10],
                              "downloadURL": (
                                  f"https://github.com/{repo}/releases/"
                                  f"download/ytkace-latest/YTKACE.ipa"
                              ),
                              "size": len(ipa_data),
                              "localizedDescription": release_notes"
                              )
                          }
                      ]
                  }
              ]
          }

          with open("apps.json", "w") as file:
              json.dump(source, file, indent=2)
              file.write("\n")

          # 9. Commit the updated SideStore source.
          subprocess.run(
              ["git", "config", "user.name", "github-actions[bot]"],
              check=True
          )

          subprocess.run(
              ["git", "config", "user.email",
               "41898282+github-actions[bot]@users.noreply.github.com"],
              check=True
          )

          subprocess.run(["git", "add", "apps.json"], check=True)

          result = subprocess.run(
              ["git", "diff", "--cached", "--quiet"]
          )

          if result.returncode == 1:
              subprocess.run(
                  ["git", "commit", "-m", f"Update YTKACE to {version}"],
                  check=True
              )

              subprocess.run(["git", "push"], check=True)

          elif result.returncode != 0:
              raise Exception("Could not check Git changes")

          print("YTKACE SideStore source updated successfully!")
          PY

          python update.py
