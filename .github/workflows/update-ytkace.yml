
name: Update SideStore Source

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-sidestore-source
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download, mirror and update SideStore source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          cat > update.py <<'PY'
          import json
          import os
          import re
          import urllib.request
          import urllib.error
          import zipfile
          import plistlib
          import subprocess

          token = os.environ["GH_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          api = "https://api.github.com"

          def request(url, method="GET", data=None,
                      content_type="application/vnd.github+json"):
              headers = {
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28"
              }

              if data is not None:
                  headers["Content-Type"] = content_type

              req = urllib.request.Request(
                  url, data=data, headers=headers, method=method
              )

              with urllib.request.urlopen(req) as response:
                  body = response.read()
                  return json.loads(body) if body else None

          def get_latest_release(upstream_repo):
              return request(
                  f"{api}/repos/{upstream_repo}/releases/latest"
              )

          def select_ipa(release, app_key):
              assets = release["assets"]

              if app_key == "ytkace":
                  matches = [
                      asset for asset in assets
                      if re.fullmatch(
                          r"YTKACE_.+_YouTube_.+\.ipa",
                          asset["name"]
                      )
                      and "iOS16" not in asset["name"]
                  ]

              elif app_key == "arrmatey":
                  # Prefer the specifically named ArrMatey.ipa.
                  exact = [
                      asset for asset in assets
                      if asset["name"].lower() == "arrmatey.ipa"
                  ]

                  if exact:
                      matches = exact
                  else:
                      matches = [
                          asset for asset in assets
                          if asset["name"].lower().endswith(".ipa")
                      ]

              else:
                  raise Exception(f"Unknown app: {app_key}")

              if len(matches) != 1:
                  raise Exception(
                      f"{app_key}: expected exactly one matching IPA, "
                      f"found {len(matches)}: "
                      f"{[a['name'] for a in matches]}"
                  )

              return matches[0]

          def extract_metadata(ipa_path):
              with zipfile.ZipFile(ipa_path) as ipa:
                  plist_paths = [
                      name for name in ipa.namelist()
                      if re.fullmatch(
                          r"Payload/[^/]+\.app/Info\.plist",
                          name
                      )
                  ]

                  if not plist_paths:
                      raise Exception(
                          f"Could not find app Info.plist in {ipa_path}"
                      )

                  info = plistlib.loads(ipa.read(plist_paths[0]))

              return {
                  "bundle_id": info["CFBundleIdentifier"],
                  "version": info["CFBundleShortVersionString"],
                  "name": info.get(
                      "CFBundleDisplayName",
                      info.get("CFBundleName", "")
                  )
              }

          def mirror_release(app):
              key = app["key"]
              upstream_repo = app["upstream_repo"]
              stable_tag = app["stable_tag"]
              filename = app["filename"]

              print(f"\n========== Updating {app['name']} ==========")

              # 1. Fetch the latest upstream release.
              upstream = get_latest_release(upstream_repo)
              upstream_tag = upstream["tag_name"]

              release_notes = (upstream.get("body") or "").strip()

              if not release_notes:
                  release_notes = (
                      "No release notes provided by the developer."
                  )

              print("Latest upstream release:", upstream_tag)

              # 2. Find the correct IPA.
              asset = select_ipa(upstream, key)
              print("Selected IPA:", asset["name"])

              # 3. Download the IPA.
              req = urllib.request.Request(
                  asset["browser_download_url"],
                  headers={"User-Agent": "SideStore-Source-Updater"}
              )

              with urllib.request.urlopen(req) as response:
                  ipa_data = response.read()

              with open(filename, "wb") as file:
                  file.write(ipa_data)

              # 4. Extract the real app metadata.
              metadata = extract_metadata(filename)

              bundle_id = metadata["bundle_id"]
              version = metadata["version"]

              print("App:", metadata["name"])
              print("Bundle ID:", bundle_id)
              print("Version:", version)
              print("IPA size:", len(ipa_data))

              # 5. Look up our permanent mirrored release.
              release = None

              try:
                  release = request(
                      f"{api}/repos/{repo}/releases/tags/{stable_tag}"
                  )

              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise

              # 6. Skip the upload if this upstream release is
              # already mirrored. Metadata is still returned so
              # apps.json can be regenerated.
              if (
                  release
                  and f"Upstream tag: {upstream_tag}"
                  in release.get("body", "")
              ):
                  print(f"{app['name']} is already up to date.")
                  return {
                      "bundle_id": bundle_id,
                      "version": version,
                      "date": (
                          upstream.get("published_at")
                          or upstream.get("created_at")
                      )[:10],
                      "size": len(ipa_data),
                      "release_notes": release_notes,
                      "download_url": (
                          f"https://github.com/{repo}/releases/"
                          f"download/{stable_tag}/{filename}"
                      )
                  }

              # 7. Prepare the mirrored release notes.
              release_body = (
                  f"Automatically mirrored from {upstream_repo}.\n\n"
                  f"Upstream tag: {upstream_tag}\n"
                  f"Original file: {asset['name']}\n\n"
                  f"---\n\n"
                  f"## Official Release Notes\n\n"
                  f"{release_notes}"
              )

              if release:
                  print("Updating existing mirrored release.")

                  # Delete only the old IPA attachment.
                  for old_asset in release.get("assets", []):
                      if old_asset["name"] == filename:
                          request(
                              f"{api}/repos/{repo}/releases/assets/"
                              f"{old_asset['id']}",
                              method="DELETE"
                          )

                  # Update the existing release without deleting
                  # its permanent tag.
                  release = request(
                      f"{api}/repos/{repo}/releases/{release['id']}",
                      method="PATCH",
                      data=json.dumps({
                          "name": f"{app['name']} {version}",
                          "body": release_body
                      }).encode()
                  )

              else:
                  print("Creating first mirrored release.")

                  release = request(
                      f"{api}/repos/{repo}/releases",
                      method="POST",
                      data=json.dumps({
                          "tag_name": stable_tag,
                          "name": f"{app['name']} {version}",
                          "body": release_body
                      }).encode()
                  )

              # 8. Upload the new IPA.
              upload_url = release["upload_url"].split("{")[0]

              request(
                  upload_url + f"?name={filename}",
                  method="POST",
                  data=ipa_data,
                  content_type="application/octet-stream"
              )

              print(f"{filename} successfully uploaded.")

              return {
                  "bundle_id": bundle_id,
                  "version": version,
                  "date": (
                      upstream.get("published_at")
                      or upstream.get("created_at")
                  )[:10],
                  "size": len(ipa_data),
                  "release_notes": release_notes,
                  "download_url": (
                      f"https://github.com/{repo}/releases/"
                      f"download/{stable_tag}/{filename}"
                  )
              }

          # 9. Define the apps managed by this source.
          apps = [
              {
                  "key": "ytkace",
                  "name": "YTKACE",
                  "upstream_repo": "itzzace/ytkace",
                  "stable_tag": "ytkace-latest",
                  "filename": "YTKACE.ipa",
                  "developer": "itzzace",
                  "subtitle": "YouTube with YTKACE modifications",
                  "icon_url": (
                      f"https://raw.githubusercontent.com/"
                      f"{repo}/main/ytkace-icon.png"
                  )
              },
              {
                  "key": "arrmatey",
                  "name": "ArrMatey",
                  "upstream_repo": "owenlejeune/ArrMatey",
                  "stable_tag": "arrmatey-latest",
                  "filename": "ArrMatey.ipa",
                  "developer": "owenlejeune",
                  "subtitle": "Mobile client for managing your *arr stack"
                  "icon_url": (
                    f"https://raw.githubusercontent.com/"
                    f"{repo}/main/arrmatey-icon.png"
                  )
              }
          ]

          # 10. Process both apps independently.
          results = {}

          for app in apps:
              results[app["key"]] = mirror_release(app)

          # 11. Generate the SideStore apps.json.
          source_apps = []

          for app in apps:
              result = results[app["key"]]

              app_entry = {
                  "name": app["name"],
                  "bundleIdentifier": result["bundle_id"],
                  "developerName": app["developer"],
                  "subtitle": app["subtitle"],
                  "localizedDescription": (
                      f"Automatically updated {app['name']} IPA."
                  ),
                  "versions": [
                      {
                          "version": result["version"],
                          "date": result["date"],
                          "downloadURL": result["download_url"],
                          "size": result["size"],
                          "localizedDescription": (
                              result["release_notes"]
                          )
                      }
                  ]
              }

              # Use the existing custom icon for YTKACE.
              # ArrMatey can use SideStore's default icon handling.
              if "icon_url" in app:
                  app_entry["iconURL"] = app["icon_url"]

              source_apps.append(app_entry)

          source = {
              "$schema": (
                  "https://github.com/SideStore/"
                  "sidestore-source-types/raw/main/schema.json"
              ),
              "name": "Personal Source",
              "subtitle": "Apps for SideStore and LiveContainer",
              "description": (
                  "My personal SideStore source for YTKACE and ArrMatey."
              ),
              "website": "https://github.com/" + repo,
              "identifier": "com.subjectginger.sidestore",
              "apps": source_apps
          }

          with open("apps.json", "w") as file:
              json.dump(source, file, indent=2)
              file.write("\n")

          # 12. Commit the updated SideStore source.
          subprocess.run(
              ["git", "config", "user.name", "github-actions[bot]"],
              check=True
          )

          subprocess.run(
              ["git", "config", "user.email",
               "41898282+github-actions[bot]@users.noreply.github.com"],
              check=True
          )

          subprocess.run(["git", "add", "apps.json"], check=True)

          result = subprocess.run(
              ["git", "diff", "--cached", "--quiet"]
          )

          if result.returncode == 1:
              versions = ", ".join(
                  f"{app['name']} {results[app['key']]['version']}"
                  for app in apps
              )

              subprocess.run(
                  ["git", "commit", "-m", f"Update apps: {versions}"],
                  check=True
              )

              subprocess.run(["git", "push"], check=True)

          elif result.returncode != 0:
              raise Exception("Could not check Git changes")

          print("\nSideStore source updated successfully!")

          for app in apps:
              print(
                  f"{app['name']}: "
                  f"{results[app['key']]['version']}"
              )
          PY

          python update.py
