
name: Update YTKACE SideStore Source

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-ytkace
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download and publish latest YTKACE
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          cat > update.py <<'PY'
          import json
          import os
          import re
          import urllib.request
          import urllib.error
          import zipfile
          import plistlib
          import subprocess
          from datetime import datetime

          token = os.environ["GH_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          api = "https://api.github.com"

          def request(url, method="GET", data=None, content_type="application/vnd.github+json"):
              headers = {
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28"
              }
              if data is not None:
                  headers["Content-Type"] = content_type
              req = urllib.request.Request(
                  url, data=data, headers=headers, method=method
              )
              with urllib.request.urlopen(req) as response:
                  body = response.read()
                  return json.loads(body) if body else None

          # Find the latest upstream release.
          upstream = request(
              f"{api}/repos/itzzace/ytkace/releases/latest"
          )

          upstream_tag = upstream["tag_name"]
          print("Latest upstream release:", upstream_tag)

          # Check whether this release has already been mirrored.
          try:
              current = request(
                  f"{api}/repos/{repo}/releases/tags/ytkace-latest"
              )
              if f"Upstream tag: {upstream_tag}" in current.get("body", ""):
                  print("Already up to date. Nothing to do.")
                  raise SystemExit(0)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise

          # Select the standard YouTube IPA, not the iOS 16 variant.
          assets = upstream["assets"]
          matches = [
              a for a in assets
              if re.fullmatch(
                  r"YTKACE_.+_YouTube_.+\.ipa",
                  a["name"]
              )
              and "iOS16" not in a["name"]
          ]

          if len(matches) != 1:
              raise Exception(
                  f"Expected one standard YouTube IPA, found {len(matches)}"
              )

          asset = matches[0]
          print("Selected IPA:", asset["name"])

          # Download the IPA.
          req = urllib.request.Request(
              asset["browser_download_url"],
              headers={"User-Agent": "YTKACE-SideStore-Updater"}
          )
          with urllib.request.urlopen(req) as response:
              ipa_data = response.read()

          with open("YTKACE.ipa", "wb") as f:
              f.write(ipa_data)

          # Read the actual app information from its Info.plist.
          with zipfile.ZipFile("YTKACE.ipa") as ipa:
              plist_paths = [
                  name for name in ipa.namelist()
                  if re.fullmatch(r"Payload/[^/]+\.app/Info\.plist", name)
              ]

              if not plist_paths:
                  raise Exception("Could not find app Info.plist in IPA")

              info = plistlib.loads(ipa.read(plist_paths[0]))

          bundle_id = info["CFBundleIdentifier"]
          version = info["CFBundleShortVersionString"]
          app_name = info.get(
              "CFBundleDisplayName",
              info.get("CFBundleName", "YTKACE")
          )

          print("App:", app_name)
          print("Bundle ID:", bundle_id)
          print("Version:", version)

          # Remove the previous mirrored release and tag.
          try:
              current = request(
                  f"{api}/repos/{repo}/releases/tags/ytkace-latest"
              )
              request(
                  f"{api}/repos/{repo}/releases/{current['id']}",
                  method="DELETE"
              )
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise

          try:
              request(
                  f"{api}/repos/{repo}/git/refs/tags/ytkace-latest",
                  method="DELETE"
              )
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise

          # Create a new mirrored release.
          release = request(
              f"{api}/repos/{repo}/releases",
              method="POST",
              data=json.dumps({
                  "tag_name": "ytkace-latest",
                  "name": f"YTKACE {version}",
                  "body": (
                      f"Automatically mirrored from itzzace/ytkace.\n\n"
                      f"Upstream tag: {upstream_tag}\n"
                      f"Original file: {asset['name']}"
                  ),
                  "make_latest": "true"
              }).encode()
          )

          # Upload the IPA to our release.
          upload_url = release["upload_url"].split("{")[0]
          request(
              upload_url + "?name=YTKACE.ipa",
              method="POST",
              data=ipa_data,
              content_type="application/octet-stream"
          )

          # Build the SideStore source.
          source = {
              "$schema": "https://github.com/SideStore/sidestore-source-types/raw/main/schema.json",
              "name": "My Personal Source",
              "identifier": "com.subjectginger.sidestore",
              "apps": [{
                  "name": "YTKACE",
                  "bundleIdentifier": bundle_id,
                  "developerName": "itzzace",
                  "subtitle": "YouTube with YTKACE modifications",
                  "localizedDescription": "Automatically updated YTKACE YouTube IPA.",
                  "iconURL": (
                      f"https://raw.githubusercontent.com/"
                      f"{repo}/main/icon.png"
                  ),
                  "versions": [{
                      "version": version,
                      "date": upstream["published_at"][:10],
                      "downloadURL": (
                          f"https://github.com/{repo}/releases/"
                          f"download/ytkace-latest/YTKACE.ipa"
                      ),
                      "size": len(ipa_data),
                      "localizedDescription": (
                          f"Mirrored from YTKACE release {upstream_tag}."
                      )
                  }]
              }]
          }

          with open("apps.json", "w") as f:
              json.dump(source, f, indent=2)
              f.write("\n")

          # Commit the updated source.
          subprocess.run(
              ["git", "config", "user.name", "github-actions[bot]"],
              check=True
          )
          subprocess.run(
              ["git", "config", "user.email",
               "41898282+github-actions[bot]@users.noreply.github.com"],
              check=True
          )
          subprocess.run(["git", "add", "apps.json"], check=True)

          result = subprocess.run(["git", "diff", "--cached", "--quiet"])

          if result.returncode == 1:
              subprocess.run(
                  ["git", "commit", "-m", f"Update YTKACE to {version}"],
                  check=True
              )
              subprocess.run(["git", "push"], check=True)

          print("YTKACE SideStore source updated successfully.")
          PY

          python update.py
